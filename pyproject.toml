[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advml"
version = "0.1.0"
description = "An educational adversarial machine learning attack and detection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Security Education Projects" }]
keywords = ["security", "machine-learning", "adversarial", "evasion", "education"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
advml = "advml.cli:main"

[tool.setuptools.packages.find]
include = ["advml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
